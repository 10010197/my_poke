name: Tests

# Run the unittest suite on every pull request, and on every change that
# lands on the production (master) or integration (develop) branches.
on:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop

# Cancel an older run of the same branch/PR when a newer commit is pushed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
